<!DOCTYPE html>
<html lang="af"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finansiële Impak - Regstreekse Barometer</title>

    <style>
        /* RESET & BASIC STYLES */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0c0c0c;
            font-family: 'Inter', 'Segoe UI', Helvetica, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* VISUAL OVERLAY */
        .overlay {
            width: 90%;
            max-width: 1200px;
            padding: 40px 60px;
            background: linear-gradient(135deg, rgba(30,30,30,0.95) 0%, rgba(15,15,15,0.95) 100%);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            align-items: center;
            gap: 30px;
            margin-bottom: 25px;
        }

        .left { text-align: left; }
        .title {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #e0e0e0;
        }
        .subtitle {
            font-size: 1.0rem;
            color: #b0b0b0;
            margin-top: 5px;
        }

        .center { text-align: center; }
        .amount-container {
            font-size: 5rem;
            font-weight: 900;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: baseline;
            text-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .currency-symbol { font-size: 3rem; margin-right: 10px; color: #2ed1a2; }

        .right { text-align: right; }
        .qr-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }
        .qr img {
            width: 110px;
            height: 110px;
            padding: 8px;
            background-color: white;
            border-radius: 8px;
        }
        .qr span { font-size: 0.9rem; font-weight: 600; color: #f0f0f0; }

        /* PROGRESS BAR */
        .bar-container {
            width: 100%;
            height: 24px;
            background-color: rgba(255,255,255,0.08);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            margin: 20px 0;
        }

        .bar {
            height: 100%;
            width: 0%; 
            background: linear-gradient(90deg, #2ed1a2 0%, #3fe1b3 100%);
            box-shadow: 0 0 15px rgba(46, 209, 162, 0.4);
            transition: width 1.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .footer {
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
            font-weight: 600;
            color: #a0a0a0;
        }

        .footer-live {
            color: #e74c3c;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .footer-live::before {
            content: '';
            width: 10px;
            height: 10px;
            background-color: #e74c3c;
            border-radius: 50%;
            animation: blink 1s infinite alternate;
        }

        @keyframes blink { from { opacity: 1; } to { opacity: 0.3; } }
        
        .pulse { animation: pulse-effect 0.6s ease-out; }
        @keyframes pulse-effect {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); border-color: #2ed1a2; }
            100% { transform: scale(1); }
        }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; text-align: center; }
            .amount-container { font-size: 3.5rem; }
            .qr-container { align-items: center; }
            .left, .right { text-align: center; }
        }
    </style>
</head>

<body>

    <div class="overlay" id="mainCard">
        <div class="grid">
            <div class="left">
                <div class="title">FINANSIËLE IMPAK</div>
                <div class="subtitle">Transparency • Growth</div>
            </div>

            <div class="center">
                <div class="amount-container">
                    <span class="currency-symbol">R</span>
                    <span id="totalDisplay">0.00</span>
                </div>
            </div>

            <div class="right">
                <div class="qr-container">
                    <div class="qr">
                        <!-- Replace YOUR_LINK with your actual Yoco payment link -->
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=YOUR_LINK" alt="QR">
                    </div>
                    <span>Scan to contribute</span>
                </div>
            </div>
        </div>

        <div class="bar-container">
            <div id="progressBar" class="bar"></div>
        </div>

        <div class="footer">
            <div class="footer-live">Live Connection</div>
            <div>Goal: <span style="color: #fff;">R50 000</span></div>
        </div>
    </div>

    <script>
        const GOAL_AMOUNT = 50000;
        let currentTotal = 0;

        /**
         * UI RENDER LOGIC
         */
        function renderUI(value) {
            const display = document.getElementById('totalDisplay');
            const bar = document.getElementById('progressBar');
            const card = document.getElementById('mainCard');

            // Format number for South African locale
            display.innerText = value.toLocaleString('af-ZA', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

            // Calculate percentage for the bar
            const percentage = Math.min((value / GOAL_AMOUNT) * 100, 100);
            bar.style.width = percentage + '%';

            // Visual feedback: pulse when value changes
            if (value !== currentTotal) {
                card.classList.remove('pulse');
                void card.offsetWidth; // Trigger reflow to restart animation
                card.classList.add('pulse');
                currentTotal = value;
            }
        }

        /**
         * LIVE STREAM CONNECTION (SSE)
         * Listens to the /events stream from your server.js
         */
        const eventSource = new EventSource('/events');

        eventSource.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);
                // Only update if data contains a valid total number
                if (data && typeof data.total === 'number') {
                    renderUI(data.total);
                }
            } catch (err) {
                console.error("Error parsing live data:", err);
            }
        };

        eventSource.onerror = function(err) {
            console.error("EventSource failed. Connection to server lost.");
        };
    </script>

</body>
</html>
