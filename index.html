<!DOCTYPE html>
<html lang="af"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gholfdag - Live Barometer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa; /* Light professional gray */
            color: #1a365d;
        }

        /* MAIN VERTICAL STACK */
        #page-wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        /* TOP SECTION: LOGOS & BRANDING */
        .header-section {
            flex: 1; /* Takes up top space */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }

        .main-logo {
            width: 100%;
            max-width: 600px;
            height: auto;
            margin-bottom: 20px;
        }

        /* BOTTOM SECTION: BAROMETER BOX */
        .barometer-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto 40px auto; /* Centered with bottom breathing room */
            background: #ffffff;
            border-radius: 30px;
            padding: 40px 60px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            align-items: center;
            gap: 20px;
        }

        .section-title {
            font-size: 2.5rem;
            font-weight: 900;
            color: #1a365d;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* CENTER AMOUNT */
        .amount-display {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 6rem;
            font-weight: 900;
            color: #2d3748;
        }
        .currency { color: #2ed1a2; margin-right: 15px; font-size: 3.5rem; }

        /* QR CODE AREA */
        .qr-area {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .qr-area img {
            width: 130px;
            background: #fff;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .qr-label {
            font-size: 0.9rem;
            font-weight: 700;
            margin-top: 10px;
            color: #718096;
        }

        /* PROGRESS BAR */
        .progress-wrapper {
            margin: 40px 0 20px 0;
        }
        .track {
            width: 100%;
            height: 35px;
            background: #edf2f7;
            border-radius: 50px;
            overflow: hidden;
        }
        .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2ed1a2, #3fe1b3);
            border-radius: 50px;
            transition: width 1.5s cubic-bezier(0.1, 0, 0.1, 1);
        }

        /* STATUS FOOTER */
        .barometer-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            color: #a0aec0;
        }
        .live-indicator {
            color: #e53e3e;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dot { height: 12px; width: 12px; background: #e53e3e; border-radius: 50%; animation: pulse 1.5s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        @media (max-width: 900px) {
            .grid { grid-template-columns: 1fr; text-align: center; }
            .qr-area { align-items: center; margin-top: 20px; }
            .amount-display { font-size: 4rem; }
        }
    </style>
</head>
<body>

    <div id="page-wrapper">
        
        <div class="header-section">
            <img src="main_page.png" alt="GHOLFDAG" class="main-logo">
            </div>

        <div class="barometer-container" id="barometer">
            <div class="grid">
                <div class="left-label">
                    <div class="section-title">INSAMELING</div>
                </div>

                <div class="amount-display">
                    <span class="currency">R</span>
                    <span id="amountText">0,00</span>
                </div>

                <div class="qr-area">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=YOUR_LINK" alt="QR">
                    <div class="qr-label">Scan to contribute</div>
                </div>
            </div>

            <div class="progress-wrapper">
                <div class="track">
                    <div class="fill" id="barFill"></div>
                </div>
            </div>

            <div class="barometer-footer">
                <div class="live-indicator"><div class="dot"></div> LIVE CONNECTION</div>
                <div class="goal-text">GOAL: <span style="color: #1a365d;">R50 000</span></div>
            </div>
        </div>

    </div>

    <script>
        const GOAL = 50000;
        const evtSource = new EventSource('/events');

        evtSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            updateBarometer(data.total);
        };

        function updateBarometer(total) {
            // Update the Rand amount
            document.getElementById('amountText').innerText = total.toLocaleString('af-ZA', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

            // Update the progress bar fill
            const percent = Math.min((total / GOAL) * 100, 100);
            document.getElementById('barFill').style.width = percent + '%';
        }
    </script>

</body>
</html>
