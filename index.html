<!DOCTYPE html>
<html lang="af"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gholfdag Live Barometer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="confetti.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
            overflow: hidden;
        }

        #page-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 30px;
            box-sizing: border-box;
        }

        /* TOP LOGOS */
        .top-banner {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex: 1;
        }

        .qr-side img {
            width: 220px;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .branding-side img {
            width: 650px;
            height: auto;
        }

        /* BAROMETER CARD */
        .barometer-card {
            position: relative;
            background: #ffffff;
            border-radius: 40px;
            padding: 70px 60px 40px 60px; /* Top padding for the overlapping logos */
            box-shadow: 0 15px 45px rgba(0,0,0,0.04);
            margin-bottom: 20px;
            transition: all 0.5s ease;
        }

        /* Beneficiary Logo Strip (Overlapping the card) */
        .org-logo-strip {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            text-align: center;
        }

        .org-logo-strip img {
            height: 110px;
            width: auto;
        }

        .main-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .label-insameling {
            font-size: 3.5rem;
            font-weight: 900;
            color: #2c3e50;
            letter-spacing: 1px;
        }

        .amount-display {
            font-size: 6.5rem;
            font-weight: 900;
            color: #2c3e50;
            display: flex;
            align-items: center;
        }

        .rand-symbol {
            color: #2ed1a2;
            margin-right: 20px;
            font-size: 4.5rem;
        }

        /* PROGRESS BAR */
        .progress-track {
            width: 100%;
            height: 50px;
            background: #f0f2f5;
            border-radius: 50px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #2ed1a2;
            border-radius: 50px;
            transition: width 2s cubic-bezier(0.1, 0, 0.1, 1);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 1.1rem;
            color: #95a5a6;
        }

        .live-tag {
            color: #e74c3c;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dot {
            height: 12px;
            width: 12px;
            background: #e74c3c;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        /* GOAL REACHED STATE */
        .goal-reached {
            background: linear-gradient(145deg, #ffffff, #fffef0);
            border: 2px solid #f1c40f;
            transform: scale(1.01);
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="page-wrapper">
        <div class="top-banner">
            <div class="qr-side"><img src="qr_side.png" alt="Scan Om Te Skenk"></div>
            <div class="branding-side"><img src="branding_top.png" alt="Gholfdag 2026"></div>
        </div>

        <div class="barometer-card" id="mainCard">
            <div class="org-logo-strip">
                <img src="org_logos.png" alt="Beneficiaries">
            </div>

            <div class="main-row">
                <div class="label-insameling">INSAMELING</div>
                <div class="amount-display">
                    <span class="rand-symbol">R</span>
                    <span id="amountValue">0,00</span>
                </div>
            </div>

            <div class="progress-track">
                <div class="progress-fill" id="barFill"></div>
            </div>

            <div class="status-bar">
                <div class="live-tag"><div class="dot"></div> Outomatiese Opdatering</div>
                <div id="goalLabel">Doelwit: <span style="color: #2c3e50;">R50 000</span></div>
            </div>
        </div>
    </div>

    <script>
        const GOAL = 50000;
        let hasCelebrated = false;

        // Function to fetch fresh total from your server
        async function refreshTotal() {
            try {
                const response = await fetch('/api/total');
                const data = await response.json();
                
                if (data.total !== undefined) {
                    updateUI(data.total);
                }
            } catch (err) {
                console.warn("Kon nie met bediener koppel nie. Probeer weer...");
            }
        }

        function updateUI(total) {
            const amountEl = document.getElementById('amountValue');
            const fillEl = document.getElementById('barFill');
            const cardEl = document.getElementById('mainCard');
            const goalLabel = document.getElementById('goalLabel');

            // Update the number with SA formatting
            amountEl.innerText = total.toLocaleString('af-ZA', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

            // Update the bar
            const percent = Math.min((total / GOAL) * 100, 100);
            fillEl.style.width = percent + '%';

            // Victory logic
            if (total >= GOAL && !hasCelebrated) {
                hasCelebrated = true;
                cardEl.classList.add('goal-reached');
                fillEl.style.background = '#f1c40f'; // Gold bar
                goalLabel.innerHTML = '🏆 <span style="color: #27ae60;">DOELWIT BEREIK!</span>';
                fireConfetti();
            }
        }

        function fireConfetti() {
            var duration = 6 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 4,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0, y: 0.8 },
                    colors: ['#2ed1a2', '#f1c40f', '#2c3e50']
                });
                confetti({
                    particleCount: 4,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1, y: 0.8 },
                    colors: ['#2ed1a2', '#f1c40f', '#2c3e50']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        // Start Polling: Check every 10 seconds
        refreshTotal(); // Initial check
        setInterval(refreshTotal, 10000); 

    </script>
</body>
</html>
